name: SPLAT CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  regression-test-and-package:
    name: Test and package SPLAT
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run complete SPLAT regression suite
        shell: pwsh
        run: ./tests/run-all-tests.ps1

      - name: Build test release
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "ci-test"

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          Get-FileHash "./dist/SPLAT-ci-test.zip" -Algorithm SHA256 |
            ForEach-Object {
              "$($_.Hash)  SPLAT-ci-test.zip"
            } |
            Set-Content "./dist/SPLAT-ci-test.sha256"

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: SPLAT-ci-test
          path: |
            dist/SPLAT-ci-test.zip
            dist/SPLAT-ci-test.sha256
